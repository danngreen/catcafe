<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat Cafe smoke test</title>
<link rel="stylesheet" href="../styles.css">
<script>
// Collect anything that goes wrong before the game module loads.
window.__errors = [];
window.addEventListener('error', (e) => {
  window.__errors.push(`ERROR: ${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`);
});
window.addEventListener('unhandledrejection', (e) => {
  window.__errors.push(`REJECT: ${e.reason && e.reason.stack ? e.reason.stack : e.reason}`);
});
const _err = console.error;
console.error = (...a) => {
  window.__errors.push('CONSOLE: ' + a.map((x) => (x && x.stack ? x.stack : String(x))).join(' '));
  _err.apply(console, a);
};
const _warn = console.warn;
console.warn = (...a) => { window.__errors.push('WARN: ' + a.join(' ')); _warn.apply(console, a); };
</script>
</head>
<body>
  <div id="frame">
    <canvas id="screen" width="480" height="270"></canvas>
  </div>

  <!-- Mirrors index.html so the touch layout can be exercised here too. -->
  <button id="fsbtn" hidden aria-label="Fullscreen">&#9974;</button>
  <div id="touch" hidden>
    <div class="dpad">
      <button data-key="ArrowUp" class="tb up">&#9650;</button>
      <button data-key="ArrowLeft" class="tb left">&#9664;</button>
      <button data-key="ArrowRight" class="tb right">&#9654;</button>
      <button data-key="ArrowDown" class="tb down">&#9660;</button>
      <button data-toggle="run" class="tb run" aria-label="Toggle run">RUN</button>
    </div>
    <div class="abtns">
      <button data-key="Escape" class="tb menu">MENU</button>
      <button data-key="x" class="tb back">BACK</button>
      <button data-key=" " class="tb act">ACT</button>
    </div>
  </div>
  <pre id="out" style="position:absolute;left:0;top:0;color:#0f0;font:12px monospace;z-index:99;background:#000;max-width:100%;white-space:pre-wrap"></pre>
  <script type="module">
    // Drive the game for a while, then report.
    const SCRIPT = (window.location.hash || '#walk').slice(1);
    const t0 = performance.now();
    try {
      await import('../src/main.js');
      window.__importMs = Math.round(performance.now() - t0);
    } catch (e) {
      window.__errors.push('IMPORT: ' + (e && e.stack ? e.stack : e));
    }

    function key(code, down) {
      window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code, bubbles: true }));
    }

    async function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

    (async () => {
      await wait(400);
      const g = window.game;
      if (!g) {
        report(['game never constructed', ...window.__errors]);
        return;
      }

      if (SCRIPT === 'walk') {
        // Walk around outdoors for a bit.
        for (const code of ['ArrowDown', 'ArrowLeft', 'ArrowUp', 'ArrowRight']) {
          key(code, true); await wait(500); key(code, false);
        }
      } else if (SCRIPT === 'cafe') {
        g.enterInterior('cafe', g.state.cafeMap, g.homeDoor.x, g.homeDoor.y);
        await wait(1200);
        g.state.shopOpen = true;
        g.state.clock.t = 11 * (1200 / 24);
        // Force a few customers through the door.
        for (let i = 0; i < 4; i++) { g.state.cafeSim.trySpawn(g.state.cafeMap); await wait(300); }
        await wait(2500);
        // Everyone still queueing should be showing what they want to order.
        const waiting = g.state.cafeSim.customers.filter((c) => c.state === 'waiting');
        window.__bubbles = `${waiting.filter((c) => c.emoteIcon).length}/${waiting.length}`;
        if (waiting.length && waiting.some((c) => !c.emoteIcon)) {
          window.__errors.push('a waiting customer had no order bubble: ' + window.__bubbles);
        }
      } else if (SCRIPT === 'summarylines') {
        // A busy night's card: it has to hold every line it shows, above the
        // Space prompt rather than over it.
        const { SummaryScreen } = await import('../src/ui/menus.js');
        const lines = [
          { text: 'Cats fed on fresh fish.', tone: 'good' },
          { text: 'Marmalade is sneezing. Take them to the vet.', tone: 'bad' },
          { text: 'Cat upkeep: 12', tone: 'cost' },
          { text: "Saffron's wage: 90", tone: 'cost' },
          { text: '4 x Croissant went off.', tone: 'warn' },
          { text: '3 asked for Matcha. You had none.', tone: 'warn' },
          { text: '2 left without buying anything.', tone: 'bad' },
        ];
        g.push(new SummaryScreen(g, {
          day: 4, customers: 14, revenue: 260, costs: 102, profit: 158, lines, slept: false,
        }));
        await wait(4200);
        const s = g.screens[g.screens.length - 1];
        window.__sum = `screen=${s && s.constructor.name} lines=${lines.length}`;
        if (!s || s.constructor.name !== 'SummaryScreen') {
          window.__errors.push('no summary card: ' + window.__sum);
        }
      } else if (SCRIPT === 'nightfolk') {
        // Dusk and dawn swap the cast over, and nobody blinks in or out: the
        // day crowd walks to a door or a treeline, the night crowd comes from
        // one. Checked by watching the walk, not just the end state.
        const st = g.state;
        const byId = (id) => g.villagers.find((v) => v.def.id === id);
        st.clock.t = 12 * (1200 / 24);
        g.updateVillagerShift();
        await wait(400);
        const dayOut = byId('nettle').shift, ghostOut = byId('woofers').shift;

        st.clock.t = 21 * (1200 / 24);      // after dark
        g.updateVillagerShift();
        await wait(300);
        const leaving = g.villagers.filter((v) => v.shift === 'leaving').length;
        const arriving = g.villagers.filter((v) => v.shift === 'arriving').length;
        // They should be *walking*, and fading rather than vanishing.
        const mid = byId('nettle');
        const midAlpha = mid.alpha;
        await wait(6000);
        const nightNow = g.villagers.filter((v) => v.def.when === 'night' && v.shift === 'here').length;
        const dayNow = g.villagers.filter((v) => v.def.when !== 'night' && v.def.when !== 'always' && v.shift === 'here').length;
        window.__night = `byDay[${dayOut}/${ghostOut}] atDusk[leaving=${leaving} arriving=${arriving}`
          + ` fading=${midAlpha < 1}] after[night=${nightNow} day=${dayNow}]`;
        if (dayOut !== 'here') window.__errors.push('day folk not out by day: ' + window.__night);
        if (ghostOut !== 'away') window.__errors.push('the ghost was out in daylight: ' + window.__night);
        if (!leaving || !arriving) window.__errors.push('nobody walked anywhere at dusk: ' + window.__night);
        if (!nightNow) window.__errors.push('night folk never arrived: ' + window.__night);
        if (dayNow) window.__errors.push('day folk still out after dark: ' + window.__night);
      } else if (SCRIPT === 'pierlook') {
        const st = g.state;
        const pier = g.landmarks.find((l) => l.id === 'pier');
        st.clock.t = 21 * (1200 / 24);
        g.player.x = pier.x * 16 + 8; g.player.y = (pier.y - 3) * 16;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        await wait(1500);
      } else if (SCRIPT === 'hedgelook') {
        const st = g.state;
        const b = g.landmarks.find((l) => l.id === 'bushes');
        st.clock.t = 21.5 * (1200 / 24);
        g.updateVillagerShift();
        g.player.x = b.x * 16 + 8; g.player.y = (b.y + 2) * 16;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        const w = g.villagers.find((v) => v.def.id === 'woofers');
        w.shift = 'here'; w.alpha = 1;
        await wait(2500);
      } else if (SCRIPT === 'journalstep') {
        // The journal has to say what to do next, or a five-step job is a
        // guessing game. Esc -> Journal, and read what it says.
        const st = g.state;
        const { QUEST_BY_ID, objectiveText } = await import('../src/game/quests.js');
        st.quests.lane_end_hedge = 'active';
        st.questStep.lane_end_hedge = 0;
        key('Escape', true); await wait(140); key('Escape', false);
        await wait(400);
        // Arrow down to Journal and open it.
        const pause = g.screens[g.screens.length - 1];
        const idx = pause ? pause.items.indexOf('Journal') : -1;
        for (let i = 0; i < idx; i++) { key('ArrowDown', true); await wait(110); key('ArrowDown', false); }
        key('Space', true); await wait(160); key('Space', false);
        await wait(500);
        const scr = g.screens[g.screens.length - 1];
        const text = objectiveText(QUEST_BY_ID.lane_end_hedge, st);
        window.__journal = `screen=${scr && scr.constructor.name} says="${text}"`;
        if (!scr || scr.constructor.name !== 'JournalScreen') {
          window.__errors.push('could not open the journal: ' + window.__journal);
        }
        if (!/hedge/i.test(text) || !/dark/i.test(text)) {
          window.__errors.push('journal does not say what to do: ' + window.__journal);
        }
        if (!/1\/5/.test(text)) window.__errors.push('journal does not show progress: ' + window.__journal);
        // A step note is a sentence, so it has to wrap: the panel is about
        // 210px wide inside its border and an unwrapped line gets clipped.
        const { textWidth } = await import('../src/engine/font.js');
        const { wrapText } = await import('../src/engine/util.js');
        const wrapped = wrapText(text, 32);
        const widest = Math.max(...wrapped.map((l) => textWidth(l)));
        window.__journal += ` lines=${wrapped.length} widest=${widest}px`;
        if (widest > 200) window.__errors.push('objective still runs off the panel: ' + window.__journal);
        await wait(600);
      } else if (SCRIPT === 'netquesthost' || SCRIPT === 'netquestguest') {
        // Two people in front of the same villager, both reading the same
        // offer. Taking it on twice used to hand out a second parcel and put
        // the step count back to zero for both of them.
        const st = g.state;
        const host = SCRIPT === 'netquesthost';
        await wait(host ? 1500 : 5000);

        // Whoever actually takes it on is the only one who gets the parcel.
        const mine = st.startQuest('lost_bell');
        if (mine) st.give('lost_bell', 1);
        await wait(2500);

        if (host) {
          st.startQuest('lane_end_hedge');
          st.setQuestStep('lane_end_hedge', 3);
        }
        await wait(3500);
        if (!host) {
          // A client a moment behind must not drag the job back to the start.
          st.startQuest('lane_end_hedge');
          st.setQuestStep('lane_end_hedge', 0);
        }
        await wait(3500);

        window.__q = `tookIt=${mine} bell=${st.quests.lost_bell}`
          + ` parcels=${st.inventory.lost_bell || 0}`
          + ` hedge=${st.quests.lane_end_hedge}@${st.questStep.lane_end_hedge || 0}`;
        if (st.quests.lost_bell !== 'active') window.__errors.push('nobody took the job: ' + window.__q);
        if ((st.inventory.lost_bell || 0) !== 1) {
          window.__errors.push('wrong number of parcels handed out: ' + window.__q);
        }
        if ((st.questStep.lane_end_hedge || 0) !== 3) {
          window.__errors.push('the job went backwards: ' + window.__q);
        }
      } else if (SCRIPT === 'debugpos') {
        // The readout has to say where you are, in the same units the world is
        // authored in — otherwise it can't help you find anything.
        const st = g.state;
        g.net.debug = true;
        const b = [...g.overworld.interacts].find(([, v]) => v.barrier === 'eastpass');
        const [bx, by] = b[0].split(',').map(Number);
        g.player.x = bx * 16 + 8; g.player.y = (by + 2) * 16 - 2;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        await wait(900);
        const p = st.hooks.playerPos();
        window.__pos = `slab=${bx},${by} standing=${Math.floor(p.x / 16)},${Math.floor(p.y / 16)} map=${p.map}`;
        if (Math.floor(p.x / 16) !== bx) window.__errors.push('position is wrong: ' + window.__pos);
        await wait(700);
      } else if (SCRIPT === 'netlivesave') {
        // Join whatever the server is actually holding and report the state of
        // the pass. Pointed at a real save, this says whether that save is
        // playable — which is the only question that matters about it.
        const st = g.state;
        const map = g.overworld;
        let w = 0;
        while (!g.net.joined && w < 8000) { await wait(250); w += 250; }
        await wait(1500);
        const stones = map.objects.filter((o) => o.id === 'eastpass');
        const flag = !!st.flags.barrier_eastpass;
        // Can you actually walk it? Flood from one bank to the other.
        const W = map.w, H = map.h;
        const reach = (from, to) => {
          const seen = new Uint8Array(W * H);
          const q = [from.y * W + from.x];
          seen[q[0]] = 1;
          for (let h = 0; h < q.length; h++) {
            const cur = q[h];
            if (cur === to.y * W + to.x) return true;
            const cx = cur % W, cy = (cur / W) | 0;
            for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
              const nx = cx + dx, ny = cy + dy;
              if (nx < 1 || ny < 1 || nx >= W - 1 || ny >= H - 1) continue;
              const ni = ny * W + nx;
              if (seen[ni] || map.solid(nx, ny)) continue;
              seen[ni] = 1; q.push(ni);
            }
          }
          return false;
        };
        const open = reach(g.towns.hollowdown.hub, g.towns.thistlewick.hub);
        window.__live = `day=${st.clock.day} money=${st.money} flag=${flag}`
          + ` stonesStanding=${stones.length} townsConnected=${open}`
          + ` quest=${st.quests.clear_the_path || 'not taken'}`;
        if (flag && stones.length) window.__errors.push('cleared pass is still blocked: ' + window.__live);
        if (!open) window.__errors.push('cannot get between the towns at all: ' + window.__live);
      } else if (SCRIPT === 'netpasscleared') {
        // The real case: joining a valley whose books already say the pass was
        // cleared. The stones must not be standing when you arrive.
        const st = g.state;
        const map = g.overworld;
        const before = map.objects.filter((o) => o.id === 'eastpass').length;
        // Whoever runs the room clears it; everybody else finds out by sync.
        st.flags.barrier_eastpass = true;
        st.touch('flags');
        let w = 0;
        while (map.objects.filter((o) => o.id === 'eastpass').length && w < 8000) {
          await wait(250); w += 250;
        }
        const after = map.objects.filter((o) => o.id === 'eastpass').length;
        window.__cleared = `via=${g.net.transport} stones ${before}->${after} in ${w}ms`;
        if (after) window.__errors.push('the pass stayed shut for the other player: ' + window.__cleared);
      } else if (SCRIPT === 'passcleared') {
        // A barrier you have already cleared has to stay cleared. The world is
        // rebuilt from the seed every time the game starts, so the stones come
        // back while the flag saying they are gone persists — which walls you
        // in behind rubble the game believes it has already removed.
        const st = g.state;
        const map = g.overworld;
        const before = map.objects.filter((o) => o.id === 'eastpass').length;
        st.flags.barrier_eastpass = true;
        // Exactly what happens on load, on joining, or when the other player
        // clears it while you are stood next to it.
        g.applyClearedBarriers();
        await wait(400);
        const after = map.objects.filter((o) => o.id === 'eastpass').length;
        const stillSolid = [];
        for (const o of map.objects) {
          if (o.id === 'eastpass') stillSolid.push(`${o.tx},${o.ty}`);
        }
        window.__cleared = `stones ${before}->${after} left=[${stillSolid.join(' ')}]`;
        if (!before) window.__errors.push('no stones to begin with: ' + window.__cleared);
        if (after) window.__errors.push('cleared stones came back: ' + window.__cleared);
      } else if (SCRIPT === 'passlook') {
        const stones = g.overworld.objects.filter((o) => o.id === 'eastpass');
        const cx = stones.reduce((a, o) => a + o.tx, 0) / stones.length;
        const cy = stones.reduce((a, o) => a + o.ty, 0) / stones.length;
        g.player.x = cx * 16 + 8; g.player.y = (cy - 2) * 16;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        await wait(1400);
      } else if (SCRIPT === 'eastpass') {
        // The blocked shortcut has to be three things at once: actually
        // blocked, actually a shortcut, and actually blocking — a boulder in
        // open grass is none of them, which is what this used to be.
        const { T } = await import('../src/art/tiles.js');
        const map = g.overworld;
        const W = map.w, H = map.h;
        const stones = map.objects.filter((o) => o.id === 'eastpass');
        const bx = Math.round(stones.reduce((a, o) => a + o.tx, 0) / Math.max(1, stones.length));
        const by = Math.round(stones.reduce((a, o) => a + o.ty, 0) / Math.max(1, stones.length));

        // Shortest walk between the two towns, optionally with the slab gone.
        const walk = (from, to, open) => {
          const seen = new Uint8Array(W * H);
          const dist = new Int32Array(W * H).fill(-1);
          const s0 = from.y * W + from.x;
          const q = [s0];
          seen[s0] = 1; dist[s0] = 0;
          for (let h = 0; h < q.length; h++) {
            const cur = q[h];
            if (cur === to.y * W + to.x) return dist[cur];
            const cxx = cur % W, cyy = (cur / W) | 0;
            for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
              const nx = cxx + dx, ny = cyy + dy;
              if (nx < 1 || ny < 1 || nx >= W - 1 || ny >= H - 1) continue;
              const ni = ny * W + nx;
              if (seen[ni]) continue;
              const isStone = open && stones.some((o) => o.tx === nx && o.ty === ny);
              if (map.solid(nx, ny) && !isStone) continue;
              seen[ni] = 1; dist[ni] = dist[cur] + 1; q.push(ni);
            }
          }
          return -1;
        };

        const hub = (id) => g.towns[id].hub;
        const shut = walk(hub('hollowdown'), hub('thistlewick'), false);
        const open = walk(hub('hollowdown'), hub('thistlewick'), true);
        const onDeck = stones.filter((o) => {
          // A stone counts as on the crossing if there is deck under or beside it.
          for (const [dx, dy] of [[0, 0], [0, -1], [0, 1], [-1, 0], [1, 0]]) {
            if (map.get(o.tx + dx, o.ty + dy) === T.BRIDGE) return true;
          }
          return false;
        }).length;

        window.__pass = `stones=${stones.length}@${bx},${by} onDeck=${onDeck}`
          + ` route shut=${shut} open=${open} saving=${shut - open}`;
        if (!stones.length) window.__errors.push('no eastern pass at all: ' + window.__pass);
        if (onDeck < stones.length) {
          window.__errors.push('stones are not on the crossing: ' + window.__pass);
        }
        if (shut < 0 || open < 0) window.__errors.push('a town is unreachable: ' + window.__pass);
        // Both halves matter. Equal distances mean the stones block nothing;
        // a short `shut` would mean there was never a long way round to save.
        if (shut - open < 40) {
          window.__errors.push('clearing it saves nothing worth the walk: ' + window.__pass);
        }
        if (open > 240) window.__errors.push('the shortcut is not short: ' + window.__pass);
      } else if (SCRIPT.startsWith('terrain')) {
        // An ASCII dump of a patch of the valley, for working out what is
        // actually where. `#terrain:x,y,w,h`.
        const [, spec] = SCRIPT.split(':');
        const [cx, cy, w, h] = (spec || '250,109,44,26').split(',').map(Number);
        const { T, isWater } = await import('../src/art/tiles.js');
        const map = g.overworld;
        const CH = {
          [T.WATER_DEEP]: '#', [T.WATER_MID]: '~', [T.WATER]: '~', [T.WATER_SHOAL]: '-',
          [T.BRIDGE]: '=', [T.SAND]: '.', [T.DIRT]: '+', [T.GRAVEL]: '+', [T.COBBLE]: '+',
          [T.GRASS]: ',', [T.MEADOW]: ',', [T.FOREST_FLOOR]: 'f', [T.STONE]: 's',
          [T.CLIFF]: 'C', [T.CLIFF_TOP]: 'c', [T.DECK]: '=', [T.HEDGE]: 'H', [T.FARM]: 'F',
        };
        const rows = [];
        const x0 = cx - (w >> 1), y0 = cy - (h >> 1);
        rows.push('      ' + Array.from({ length: w }, (_, i) =>
          ((x0 + i) % 10 === 0 ? '|' : ' ')).join(''));
        for (let y = y0; y < y0 + h; y++) {
          let row = '';
          for (let x = x0; x < x0 + w; x++) {
            const it = map.interactAt(x, y);
            if (it && it.kind === 'barrier') { row += 'X'; continue; }
            if (map.blocked[y * map.w + x]) { row += 'O'; continue; }
            row += CH[map.get(x, y)] || '?';
          }
          rows.push(String(y).padStart(5) + ' ' + row);
        }
        // Positions, not eyeballing: the summary gets trimmed, which shifts any
        // ruler line relative to the rows underneath it.
        const marks = [];
        for (const [k, v] of map.interacts) {
          if (v.kind === 'barrier') marks.push('bar@' + k);
        }
        const stones = map.objects
          .filter((o) => o.id === 'eastpass')
          .map((o) => `${o.tx},${o.ty}`);
        window.__terrain = `x0=${x0} y0=${y0}\nstones ${stones.join(' ')}\n`
          + `barrier tiles ${marks.slice(0, 12).join(' ')}\n` + rows.join('\n')
          + '\nkey: ~ water  = bridge/deck  + road  , grass  f forest  c chalk'
          + '  C cliff  s stone  O blocked  X barrier';
      } else if (SCRIPT === 'titleme') {
        // What this browser played as last time should be waiting on the join
        // screen. Done across a real reload, because that is the only thing
        // that proves it was read back rather than still sitting in memory.
        const PHASE = 'catcafe.test.phase';
        let phase = null;
        try { phase = localStorage.getItem(PHASE); } catch (e) {}
        if (!phase) {
          try {
            localStorage.setItem('catcafe.me',
              JSON.stringify({ name: 'Tobias', coat: 'grey', cloth: '#7fbe57' }));
            localStorage.setItem(PHASE, 'two');
          } catch (e) {}
          location.reload();
          await wait(20000);            // the reload takes it from here
        } else {
          try { localStorage.removeItem(PHASE); } catch (e) {}
          const scr = g.screens[0];
          window.__me = `name=${scr && scr.name} coat=${scr && scr.look.coat}`
            + ` cloth=${scr && scr.look.cloth} remembered=${scr && scr.remembered}`;
          if (!scr) window.__errors.push('no title screen: ' + window.__me);
          else {
            if (scr.name !== 'Tobias') window.__errors.push('forgot the name: ' + window.__me);
            if (scr.look.coat !== 'grey') window.__errors.push('forgot the coat: ' + window.__me);
            if (scr.look.cloth !== '#7fbe57') window.__errors.push('forgot the clothes: ' + window.__me);
          }
          try { localStorage.removeItem('catcafe.me'); } catch (e) {}
        }
      } else if (SCRIPT === 'netlobbydel') {
        // Deleting a valley from the lobby: asks first, starts on No, refuses
        // while anybody is in there, and the row goes when it is gone.
        const { NetClient } = await import('../src/net/client.js');
        while (((await NetClient.listGames()) || []).length < 3) await NetClient.newGame();
        if (!g.lobbyGames || g.lobbyGames.length < 3) {
          if (!sessionStorage.getItem('delReload')) {
            sessionStorage.setItem('delReload', '1');
            location.reload();
            await wait(20000);
          }
        }
        sessionStorage.removeItem('delReload');
        const scr = g.screens[g.screens.length - 1];
        const before = scr.games.length;
        // Point at the last valley, which nobody has joined.
        scr.index = before - 1;
        const doomed = scr.rows[scr.index];

        // X asks rather than doing it.

        + (window.__repair ? ` ${window.__repair}` : '')
        + (window.__keys ? ` ${window.__keys}` : '')
        + (window.__furn ? ` ${window.__furn}` : '')
        + (window.__pass ? ` ${window.__pass}` : '')
        + (window.__cleared ? ` ${window.__cleared}` : '')
        + (window.__emp ? ` ${window.__emp}` : '')
        + (window.__mapp ? ` ${window.__mapp}` : '')
        + (window.__me ? ` ${window.__me}` : '')
        + (window.__lobby ? ` ${window.__lobby}` : '')
        + (window.__del ? ` ${window.__del}` : '')
        + (window.__two ? ` ${window.__two}` : '')
        + (window.__live ? ` ${window.__live}` : '')
        + (window.__ghost ? ` ${window.__ghost}` : '')
        + (window.__bubbles !== undefined ? ` orderBubbles=${window.__bubbles}` : '');
      if (window.__terrain) { out.textContent = window.__terrain; document.title = 'OK'; window.__done = true; return; }
      const info = g ? `mode=${g.mode} map=${g.state.mapId} objs=${g.currentMap ? g.currentMap.objects.length : '?'} villagers=${g.villagers ? g.villagers.length : '?'} money=${g.state.money} cats=${g.state.cats.length} seats=${g.state.cafeSim.seats().length}${extra}` : 'no game';
      out.textContent = `RESULT ${errs.length ? 'FAIL' : 'OK'} (${errs.length} issues)\n${info}\n` + errs.slice(0, 25).join('\n');
      document.title = errs.length ? `FAIL ${errs.length}` : 'OK';
      if (window.location.search.includes('hideout')) out.style.display = 'none';
      // The runner watches for this rather than sleeping out the clock. Most
      // scenarios finish well inside their budget, and waiting for the budget
      // anyway was most of the time the suite took.
      window.__done = true;
    }
  </script>
</body>
</html>
