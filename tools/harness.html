<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat Cafe smoke test</title>
<link rel="stylesheet" href="../styles.css">
<script>
// Collect anything that goes wrong before the game module loads.
window.__errors = [];
window.addEventListener('error', (e) => {
  window.__errors.push(`ERROR: ${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`);
});
window.addEventListener('unhandledrejection', (e) => {
  window.__errors.push(`REJECT: ${e.reason && e.reason.stack ? e.reason.stack : e.reason}`);
});
const _err = console.error;
console.error = (...a) => {
  window.__errors.push('CONSOLE: ' + a.map((x) => (x && x.stack ? x.stack : String(x))).join(' '));
  _err.apply(console, a);
};
const _warn = console.warn;
console.warn = (...a) => { window.__errors.push('WARN: ' + a.join(' ')); _warn.apply(console, a); };
</script>
</head>
<body>
  <div id="frame">
    <canvas id="screen" width="480" height="270"></canvas>
  </div>

  <!-- Mirrors index.html so the touch layout can be exercised here too. -->
  <button id="fsbtn" hidden aria-label="Fullscreen">&#9974;</button>
  <div id="touch" hidden>
    <div class="dpad">
      <button data-key="ArrowUp" class="tb up">&#9650;</button>
      <button data-key="ArrowLeft" class="tb left">&#9664;</button>
      <button data-key="ArrowRight" class="tb right">&#9654;</button>
      <button data-key="ArrowDown" class="tb down">&#9660;</button>
      <button data-toggle="run" class="tb run" aria-label="Toggle run">RUN</button>
    </div>
    <div class="abtns">
      <button data-key="Escape" class="tb menu">MENU</button>
      <button data-key="x" class="tb back">BACK</button>
      <button data-key=" " class="tb act">ACT</button>
    </div>
  </div>
  <pre id="out" style="position:absolute;left:0;top:0;color:#0f0;font:12px monospace;z-index:99;background:#000;max-width:100%;white-space:pre-wrap"></pre>
  <script type="module">
    // Drive the game for a while, then report.
    const SCRIPT = (window.location.hash || '#walk').slice(1);
    const t0 = performance.now();
    try {
      await import('../src/main.js');
      window.__importMs = Math.round(performance.now() - t0);
    } catch (e) {
      window.__errors.push('IMPORT: ' + (e && e.stack ? e.stack : e));
    }

    function key(code, down) {
      window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code, bubbles: true }));
    }

    async function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

    (async () => {
      await wait(400);
      const g = window.game;
      if (!g) {
        report(['game never constructed', ...window.__errors]);
        return;
      }

      if (SCRIPT === 'walk') {
        // Walk around outdoors for a bit.
        for (const code of ['ArrowDown', 'ArrowLeft', 'ArrowUp', 'ArrowRight']) {
          key(code, true); await wait(500); key(code, false);
        }
      } else if (SCRIPT === 'cafe') {
        g.enterInterior('cafe', g.state.cafeMap, g.homeDoor.x, g.homeDoor.y);
        await wait(1200);
        g.state.shopOpen = true;
        g.state.clock.t = 11 * (1200 / 24);
        // Force a few customers through the door.
        for (let i = 0; i < 4; i++) { g.state.cafeSim.trySpawn(g.state.cafeMap); await wait(300); }
        await wait(2500);
        // Everyone still queueing should be showing what they want to order.
        const waiting = g.state.cafeSim.customers.filter((c) => c.state === 'waiting');
        window.__bubbles = `${waiting.filter((c) => c.emoteIcon).length}/${waiting.length}`;
        if (waiting.length && waiting.some((c) => !c.emoteIcon)) {
          window.__errors.push('a waiting customer had no order bubble: ' + window.__bubbles);
        }
      } else if (SCRIPT === 'build') {
        // Go in the way a player does: through Trowel & Sons.
        g.state.workers = 2; g.state.materials = 3; g.state.money = 5000;
        g.openShopCounter('builder');
        await wait(500);
        key('Space', true); await wait(220); key('Space', false);   // finish typing
        await wait(250);
        key('Space', true); await wait(220); key('Space', false);   // close greeting
        await wait(500);
        window.__builder = g.screens.length ? g.screens[g.screens.length - 1].constructor.name : 'none';
        key('ArrowDown', true); await wait(230); key('ArrowDown', false);  // -> Start building
        key('Space', true); await wait(230); key('Space', false);
        await wait(700);
        const bs = g.screens[g.screens.length - 1];
        window.__build = bs ? bs.constructor.name : 'none';
        window.__tabs = bs && bs.modes ? bs.modes.join('/') : '?';
        if (window.__build !== 'BuildScreen') {
          window.__errors.push('builder yard did not open build mode (got ' + window.__build + ')');
        }
        await wait(300);
        for (const code of ['ArrowRight', 'ArrowRight', 'ArrowDown']) { key(code, true); await wait(160); key(code, false); }
        key('Space', true); await wait(120); key('Space', false);
        for (const code of ['ArrowRight', 'ArrowRight', 'ArrowRight', 'ArrowDown', 'ArrowDown', 'ArrowDown']) { key(code, true); await wait(140); key(code, false); }
        key('Space', true); await wait(160); key('Space', false);
        await wait(600);
      } else if (SCRIPT === 'shop') {
        const door = g.doorByShop.get('grocer');
        g.state.clock.t = 10 * (1200 / 24);
        g.player.x = door.x * 16 + 8; g.player.y = (door.y + 1) * 16 - 2;
        g.openDoor({ kind: 'door', shop: 'grocer', name: 'grocer' }, door);
        await wait(1400);
        g.openShopCounter('grocer');
        await wait(300);
        key('Space', true); await wait(150); key('Space', false);
        await wait(900);
      } else if (SCRIPT === 'menus') {
        g.push(new (Object.getPrototypeOf(g.screens[0] || {}).constructor || Object)());
        await wait(200);
      } else if (SCRIPT === 'night') {
        g.state.clock.t = 22 * (1200 / 24);
        await wait(1200);
      } else if (SCRIPT === 'town') {
        const t = g.towns.hollowdown.hub;
        g.player.x = t.x * 16 + 8; g.player.y = t.y * 16;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        await wait(900);
      } else if (SCRIPT === 'coast') {
        const t = g.towns.saltmere.hub;
        g.player.x = t.x * 16 + 8; g.player.y = t.y * 16;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        await wait(900);
      } else if (SCRIPT.startsWith('systems')) {
        const only = SCRIPT.slice(7);   // '', '1' or '2'
        const st = g.state;
        window.__step = 'start';
        if (only !== '2') {
          // Quests: accept and satisfy.
          window.__step = 'quests';
          st.quests.first_beans = 'active';
          st.give('house_coffee', 10);
          g.refreshQuestMarks();
          // Economy: run a day's trading in the cafe.
          window.__step = 'trading';
          st.shopOpen = true;
          st.clock.t = 12 * (1200 / 24);
          g.enterInterior('cafe', st.cafeMap, g.homeDoor.x, g.homeDoor.y);
          await wait(900);
          for (let i = 0; i < 6; i++) { st.cafeSim.trySpawn(st.cafeMap); await wait(200); }
          await wait(7000);   // long enough for orders to be served and paid for
          window.__customers = st.cafeSim.customers.length;
          window.__revenue = st.cafeSim.todayRevenue;
        }
        if (only !== '1') {
          // Cats and the overnight roll.
          window.__step = 'rollover';
          if (st.cats[0]) st.cats[0].sick = true;
          st.give('good_food', 4);
          st.clock.t = 1199.2;   // the clock runs at 1:1 with real time
          await wait(1600);
          window.__summaryShown = g.screens.length > 0;
          g.screens.length = 0;
          window.__step = 'save';
          const okSave = st.save();
          const cash = st.money;
          st.money = 12345;
          const okLoad = st.load();
          window.__saveOk = okSave && okLoad && st.money === cash;
          if (!window.__saveOk) window.__errors.push('save/load round trip failed');
          if (!window.__summaryShown) window.__errors.push('no day summary appeared');
        }
        window.__step = 'done';
        await wait(300);
      } else if (SCRIPT === 'tabmobile') {
        // Build-mode tabs by touch: Tab is keyboard-only.
        const st = g.state;
        st.workers = 2; st.materials = 3; st.money = 5000;
        g.openBuildMode();
        await wait(800);
        const bs = g.screens[g.screens.length - 1];
        window.__mode0 = bs.modeName;
        const canvas = document.getElementById('screen');
        const tapCanvas = (gx, gy) => {
          const r = canvas.getBoundingClientRect();
          const cx = r.left + (gx / 480) * r.width;
          const cy = r.top + (gy / 270) * r.height;
          for (const type of ['pointerdown', 'pointerup']) {
            canvas.dispatchEvent(new PointerEvent(type, { bubbles: true, clientX: cx, clientY: cy }));
          }
        };
        // Tap the last tab (Style).
        const last = bs.tabRects[bs.tabRects.length - 1];
        tapCanvas(last.x + last.w / 2, last.y + last.h / 2);
        await wait(400);
        window.__mode1 = bs.modeName;
        // And back to the first.
        const first = bs.tabRects[0];
        tapCanvas(first.x + first.w / 2, first.y + first.h / 2);
        await wait(400);
        window.__mode2 = bs.modeName;
        window.__tabs2 = `${window.__mode0}->${window.__mode1}->${window.__mode2}`;
        if (window.__mode1 === window.__mode0) window.__errors.push('tapping a tab did nothing: ' + window.__tabs2);
        if (window.__mode2 !== window.__mode0) window.__errors.push('could not tap back: ' + window.__tabs2);
      } else if (SCRIPT === 'runmobile') {
        // Three ways to run: Shift, the RUN toggle, and double-tap-and-hold.
        const tap = (sel, type) => {
          const el = document.querySelector(sel);
          el.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true }));
        };
        const measure = async (before, after) => {
          const x0 = g.player.x, y0 = g.player.y;
          before();
          tap('.tb.right', 'pointerdown');
          await wait(900);
          tap('.tb.right', 'pointerup');
          const d = Math.hypot(g.player.x - x0, g.player.y - y0);
          after();
          await wait(200);
          return d;
        };
        const walk = await measure(() => {}, () => {});
        const latched = await measure(() => tap('.tb.run', 'pointerdown'), () => tap('.tb.run', 'pointerdown'));
        // Double-tap: a quick tap, then press and hold.
        const dbl = await measure(() => {
          tap('.tb.right', 'pointerdown');
          tap('.tb.right', 'pointerup');
        }, () => {});
        window.__run = `walk=${walk.toFixed(0)} latch=${latched.toFixed(0)} dbl=${dbl.toFixed(0)}`;
        if (latched < walk * 1.3) window.__errors.push('RUN toggle did not speed you up: ' + window.__run);
        if (dbl < walk * 1.3) window.__errors.push('double-tap did not speed you up: ' + window.__run);
        if (g.input.runLatch) window.__errors.push('RUN toggle did not turn back off');
        // Leave it lit for the screenshot.
        tap('.tb.run', 'pointerdown');
        tap('.tb.right', 'pointerdown');
        await wait(700);
      } else if (SCRIPT === 'pausemobile') {
        // Pause menu with the touch pads overlaid: the info card must clear them.
        await wait(400);
        key('Escape', true); await wait(200); key('Escape', false);
        await wait(700);
        const top = g.screens[g.screens.length - 1];
        window.__paused = top ? top.constructor.name : 'none';
        window.__safe = `${Math.round(g.safe ? g.safe.left : -1)},${Math.round(g.safe ? g.safe.right : -1)}`;
        if (window.__paused !== 'PauseScreen') window.__errors.push('pause menu did not open');
      } else if (SCRIPT === 'dialogmobile') {
        g.dialogue.say('Testing how a long line of dialogue sits when the thumb pads are floating over the bottom corners of the view.', { speaker: 'Hollis' });
        await wait(1500);
      } else if (SCRIPT === 'furnshop') {
        // The furniture catalogue, where every row used to be the same brown box.
        const st = g.state;
        st.money = 4000;
        st.clock.t = 12 * (1200 / 24);
        const door = g.doorByShop.get('furniture');
        g.player.x = door.x * 16 + 8; g.player.y = (door.y + 1) * 16 - 2;
        g.openDoor({ kind: 'door', shop: 'furniture', name: 'furniture' }, door);
        await wait(1400);
        g.openShopCounter('furniture');
        await wait(400);
        key('Space', true); await wait(250); key('Space', false);
        await wait(250);
        key('Space', true); await wait(250); key('Space', false);
        await wait(700);
        const sc = g.screens[g.screens.length - 1];
        window.__shop = sc ? sc.constructor.name : 'none';
        // Pick the third colourway of the chair, buy two, and check the bag.
        if (sc && sc.colours) {
          key('ArrowRight', true); await wait(200); key('ArrowRight', false);
          key('ArrowRight', true); await wait(200); key('ArrowRight', false);
          window.__variant = sc.variant;
          key('Space', true); await wait(220); key('Space', false);   // qty prompt
          key('ArrowUp', true); await wait(200); key('ArrowUp', false);
          key('Space', true); await wait(250); key('Space', false);   // buy
          await wait(500);
          const keys = Object.keys(st.inventory).filter((k) => k.startsWith('f_chair'));
          window.__bagKeys = keys.join(',') + '=' + keys.map((k) => st.inventory[k]).join(',');
          if (!keys.some((k) => k.includes('#'))) {
            window.__errors.push('colour choice was not recorded in the bag: ' + window.__bagKeys);
          }
        }
        window.__stockIcons = sc && sc.items
          ? sc.items.map((id) => (window.game ? id : id)).length + ' items' : 'none';
        if (window.__shop !== 'ShopScreen') window.__errors.push('furniture shop did not open: ' + window.__shop);
        await wait(400);
      } else if (SCRIPT === 'taxi') {
        const st = g.state;
        st.money = 3000;
        st.visit('brambleford', 'Brambleford', 96, 168);
        st.visit('hollowdown', 'Hollowdown', 212, 72);
        g.flyTaxi({ id: 'hollowdown', name: 'Hollowdown', x: 212, y: 72 });
        await wait(600);
        window.__cut = g.cutscene ? g.cutscene.phase + ':' + g.cutscene.stage : 'none';
        if (!g.cutscene) window.__errors.push('taxi cutscene never started');
        await wait(4200);
        window.__cut2 = g.cutscene ? g.cutscene.phase + ':' + g.cutscene.stage : 'none';
        window.__landed = `${g.player.tx},${g.player.ty}`;
        await wait(3200);
        if (g.cutscene) window.__errors.push('taxi cutscene never finished: ' + g.cutscene.phase);
        if (Math.abs(g.player.tx - 212) > 4 || Math.abs(g.player.ty - 73) > 4) {
          window.__errors.push('taxi did not land at the destination: ' + window.__landed);
        }
        // Start another pickup and hold it mid-hover so the screenshot shows it.
        g.flyTaxi({ id: 'brambleford', name: 'Brambleford', x: 96, y: 168 });
        await wait(1100);
        if (g.cutscene) g.cutscene.stageT = -1e6;   // freeze the hover for the camera
        window.__hover = g.cutscene ? g.cutscene.stage : 'none';
        await wait(400);
      } else if (SCRIPT === 'sleep') {
        const st = g.state;
        const door = g.doorByShop.get('inn');
        st.clock.t = 20 * (1200 / 24);
        g.player.x = door.x * 16 + 8; g.player.y = (door.y + 1) * 16 - 2;
        g.openDoor({ kind: 'door', shop: 'inn', name: 'inn' }, door);
        await wait(1500);
        window.__innMap = g.state.mapId;
        window.__stairs = g.currentMap.meta && g.currentMap.meta.stairs
          ? `${g.currentMap.meta.stairs.x},${g.currentMap.meta.stairs.y}` : 'none';
        g.restAtInn();
        await wait(500);
        key('Space', true); await wait(250); key('Space', false);   // finish typing
        await wait(300);
        key('Space', true); await wait(250); key('Space', false);   // "Yes please"
        await wait(600);
        window.__walk = g.cutscene ? g.cutscene.constructor.name : 'none';
        if (window.__walk !== 'StairWalk') window.__errors.push('no stair walk: ' + window.__walk);
        await wait(4000);
        const top = g.screens[g.screens.length - 1];
        window.__summary = top ? top.constructor.name : 'none';
        window.__slept = top && top.s ? !!top.s.slept : false;
        if (window.__summary !== 'SummaryScreen') window.__errors.push('no summary after sleeping');
        if (!window.__slept) window.__errors.push('summary did not know you slept');
      } else if (SCRIPT === 'treats') {
        const st = g.state;
        st.give('treats', 3);
        st.give('catnip', 1);
        g.enterInterior('cafe', st.cafeMap, g.homeDoor.x, g.homeDoor.y);
        await wait(1200);
        const cat = st.cats[0];
        cat.happiness = 0.4;

        // 1. Through the cafe book's Cats tab.
        const t0 = st.inventory.treats, j0 = cat.happiness;
        key('KeyC', true); await wait(160); key('KeyC', false);
        await wait(400);
        for (let i = 0; i < 2; i++) { key('ArrowRight', true); await wait(200); key('ArrowRight', false); }
        await wait(300);
        key('Space', true); await wait(220); key('Space', false);
        await wait(500);
        window.__bookTreat = `treats ${t0}->${st.inventory.treats || 0} joy ${j0.toFixed(2)}->${cat.happiness.toFixed(2)}`;
        if ((st.inventory.treats || 0) >= t0) window.__errors.push('cats tab did not consume a treat');
        if (cat.happiness <= j0) window.__errors.push('cats tab did not raise joy');
        key('Escape', true); await wait(200); key('Escape', false);
        await wait(600);

        // 2. By walking up to a cat in the room.
        const live = st.catActors[0];
        g.player.x = live.x; g.player.y = live.y + 6;
        const t1 = st.inventory.treats || 0, j1 = live.happiness;
        g.interact();
        await wait(700);
        window.__choices = g.dialogue.choices ? g.dialogue.choices.map((c) => c.value).join(',') : 'none';
        key('Space', true); await wait(250); key('Space', false);   // finish typing
        await wait(300);
        key('Space', true); await wait(250); key('Space', false);   // take first choice
        await wait(700);
        window.__petTreat = `treats ${t1}->${st.inventory.treats || 0} joy ${j1.toFixed(2)}->${live.happiness.toFixed(2)}`;
        if (!window.__choices.includes('treat')) window.__errors.push('no treat option offered near a cat: ' + window.__choices);
        if ((st.inventory.treats || 0) >= t1) window.__errors.push('petting did not consume a treat');
        if (live.happiness <= j1) window.__errors.push('petting did not raise joy');
        // Leave a choice menu open so the screenshot shows it.
        g.player.x = live.x; g.player.y = live.y + 6;
        g.interact();
        await wait(900);
        key('Space', true); await wait(200); key('Space', false);
      } else if (SCRIPT === 'exterior') {
        // Picking colours must actually change the building you walk past.
        const st = g.state;
        const before = g.cafeBuilding && g.cafeBuilding.sprite;
        const beforeCfg = g.cafeBuilding && { ...g.cafeBuilding.cfg };
        st.cafe.roof = '#5a6472';
        st.cafe.awning = '#7fbe57';
        g.refreshCafeExterior();
        await wait(300);
        const after = g.cafeBuilding && g.cafeBuilding.sprite;
        window.__ext = `cfg=${beforeCfg && beforeCfg.roof}/${beforeCfg && beforeCfg.awning}`
          + ` -> ${g.cafeBuilding && g.cafeBuilding.cfg.roof}/${g.cafeBuilding && g.cafeBuilding.cfg.awning}`
          + ` spriteChanged=${before !== after}`;
        if (!g.cafeBuilding) window.__errors.push('cafe building not found on the overworld');
        else if (before === after) window.__errors.push('cafe sprite did not change with the colours');
        else if (g.cafeBuilding.cfg.roof !== '#5a6472' || g.cafeBuilding.cfg.awning !== '#7fbe57') {
          window.__errors.push('cafe config did not take the chosen colours');
        }
        // Stand outside so the screenshot shows it.
        g.player.x = g.homeDoor.x * 16 + 8;
        g.player.y = (g.homeDoor.y + 3) * 16;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        await wait(600);
      } else if (SCRIPT === 'furnish') {
        // The whole "I bought a chair, now what" path, with no builders hired.
        const st = g.state;
        const seatsBefore = st.cafeSim.seats().length;
        const chairsBefore = st.inventory.f_chair || 0;
        g.enterInterior('cafe', st.cafeMap, g.homeDoor.x, g.homeDoor.y);
        await wait(1200);
        key('KeyC', true); await wait(160); key('KeyC', false);   // cafe book
        await wait(400);
        window.__book = g.screens.length ? g.screens[g.screens.length - 1].constructor.name : 'none';
        key('Space', true); await wait(180); key('Space', false); // arrange & build
        await wait(700);
        const top = g.screens[g.screens.length - 1];
        window.__build = top ? top.constructor.name : 'none';
        window.__buildMode = top && top.modeName;
        window.__tabs = top && top.modes ? top.modes.join('/') : '?';
        // Move somewhere clear and drop a chair.
        for (const k of ['ArrowDown', 'ArrowDown', 'ArrowLeft']) { key(k, true); await wait(170); key(k, false); }
        key('Space', true); await wait(200); key('Space', false);
        await wait(700);
        window.__placed = (st.inventory.f_chair || 0) < chairsBefore;
        const chairsOnMapBefore = g.currentMap.objects.filter((o) => o.type === 'chair').length;
        key('Escape', true); await wait(200); key('Escape', false); // finish
        await wait(1200);
        window.__seats = `${seatsBefore}->${st.cafeSim.seats().length}`;
        // Back in normal play: the furniture must still be in the map we are
        // actually walking around, not just in the build screen's draft.
        window.__liveMap = g.currentMap === st.cafeMap;
        const chairsOnMapAfter = g.currentMap.objects.filter((o) => o.type === 'chair').length;
        window.__chairs = `${chairsOnMapBefore}->${chairsOnMapAfter}`;
        if (window.__build !== 'BuildScreen') window.__errors.push('cafe book did not open build mode: ' + window.__build);
        if (!window.__placed) window.__errors.push('chair was not placed');
        if (st.cafeSim.seats().length <= seatsBefore) window.__errors.push('seat count did not rise: ' + window.__seats);
        if (!window.__liveMap) window.__errors.push('live map is stale after rebuild');
        if (chairsOnMapAfter <= chairsOnMapBefore) window.__errors.push('placed furniture vanished on exit: ' + window.__chairs);
      } else if (SCRIPT === 'door') {
        // Enter and leave a building repeatedly from the doorstep itself. The
        // trap only appeared when you pressed Space while standing on the mat.
        const st = g.state;
        const door = g.doorByShop.get('cafe');
        const results = [];
        for (let round = 0; round < 3; round++) {
          g.player.x = door.x * 16 + 8;
          g.player.y = (door.y + 1) * 16 - 2;
          g.player.dir = 'up';
          g.interact();
          await wait(1100);
          const inside = g.state.mapId;
          key('ArrowDown', true); await wait(1000); key('ArrowDown', false);
          await wait(1100);
          const before = { x: g.player.x, y: g.player.y };
          let moved = false;
          for (const k of ['ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowUp']) {
            key(k, true); await wait(280); key(k, false);
            if (Math.hypot(g.player.x - before.x, g.player.y - before.y) > 3) { moved = true; break; }
          }
          results.push(`${round}:${inside}->${g.state.mapId}:${moved ? 'free' : 'STUCK'}`);
        }
        window.__door = results.join(' ');
        if (results.some((r) => r.includes('STUCK'))) {
          window.__errors.push('trapped after leaving a building: ' + window.__door);
        }
      } else if (SCRIPT.startsWith('title')) {
        const ts = g.screens[0];
        ts.index = ts.options.indexOf('New game');
        key('Space', true); await wait(220); key('Space', false);
        await wait(500);
        window.__stage = ts.stage;
        // Drop to the roof row and recolour it, then the walls.
        for (let i = 0; i < 2; i++) { key('ArrowDown', true); await wait(190); key('ArrowDown', false); }
        for (let i = 0; i < 2; i++) { key('ArrowRight', true); await wait(210); key('ArrowRight', false); }
        key('ArrowDown', true); await wait(190); key('ArrowDown', false);
        key('ArrowRight', true); await wait(210); key('ArrowRight', false);
        await wait(500);
        if (ts.stage !== 'create') window.__errors.push('did not reach the creation screen');
      } else if (SCRIPT === 'map') {
        // A realistic cluster: a town plus the shops inside it, all within a
        // few tiles of each other.
        g.state.visit('brambleford', 'Brambleford', 96, 168);
        g.state.visit('cafe', 'Your Cat Cafe', 97, 170, 'brambleford');
        g.state.visit('grocer', "Pips' Provisions", 100, 166, 'brambleford');
        g.state.visit('bakery', 'The Warm Loaf', 93, 172, 'brambleford');
        g.state.visit('inn', 'The Sleeping Hare', 103, 173, 'brambleford');
        g.state.visit('saltmere', 'Saltmere', 66, 240);
        g.state.visit('vet', 'Dr. Bramble, Vet', 70, 242, 'saltmere');
        g.state.visit('hollowdown', 'Hollowdown', 212, 72);
        g.state.visit('thistlewick', 'Thistlewick', 270, 200);
        g.state.visit('stones', 'The Standing Stones', 262, 44);
        await wait(200);
        key('KeyM', true); await wait(150); key('KeyM', false);
        await wait(500);
        // Move the selection so the screenshot shows the highlighted label.
        for (let i = 0; i < 4; i++) { key('ArrowDown', true); await wait(200); key('ArrowDown', false); }
        const ms = g.screens[g.screens.length - 1];
        window.__mapSel = ms && ms.places ? `${ms.index + 1}/${ms.places.length}` : 'none';
        await wait(600);
      }

      await wait(600);
      report(window.__errors);
    })();

    function report(errs) {
      const out = document.getElementById('out');
      const g = window.game;
      const extra = (window.__step ? ` step=${window.__step} customers=${window.__customers} revenue=${window.__revenue} summary=${window.__summaryShown} save=${window.__saveOk}` : '')
        + (window.__door ? ` door=[${window.__door}]` : '')
        + (window.__build ? ` book=${window.__book} build=${window.__build} mode=${window.__buildMode} tabs=${window.__tabs} placed=${window.__placed} seats=${window.__seats} liveMap=${window.__liveMap} chairs=${window.__chairs}` : '')
        + (window.__stage ? ` stage=${window.__stage}` : '')
        + (window.__paused ? ` paused=${window.__paused} safe=${window.__safe}` : '')
        + (window.__run ? ` ${window.__run}` : '')
        + (window.__tabs2 ? ` modes=${window.__tabs2}` : '')
        + (window.__ext ? ` ${window.__ext}` : '')
        + (window.__bookTreat ? ` book[${window.__bookTreat}] pet[${window.__petTreat}] choices=${window.__choices}` : '')
        + (window.__mapSel ? ` mapSel=${window.__mapSel}` : '')
        + (window.__shop ? ` shop=${window.__shop} ${window.__stockIcons} variant=${window.__variant} bag=${window.__bagKeys}` : '')
        + (window.__cut ? ` hover=${window.__hover} cut=${window.__cut}->${window.__cut2} landed=${window.__landed}` : '')
        + (window.__walk ? ` inn=${window.__innMap} stairs=${window.__stairs} walk=${window.__walk} summary=${window.__summary} slept=${window.__slept}` : '')
        + (window.__bubbles !== undefined ? ` orderBubbles=${window.__bubbles}` : '');
      const info = g ? `mode=${g.mode} map=${g.state.mapId} objs=${g.currentMap ? g.currentMap.objects.length : '?'} villagers=${g.villagers ? g.villagers.length : '?'} money=${g.state.money} cats=${g.state.cats.length} seats=${g.state.cafeSim.seats().length}${extra}` : 'no game';
      out.textContent = `RESULT ${errs.length ? 'FAIL' : 'OK'} (${errs.length} issues)\n${info}\n` + errs.slice(0, 25).join('\n');
      document.title = errs.length ? `FAIL ${errs.length}` : 'OK';
      if (window.location.search.includes('hideout')) out.style.display = 'none';
    }
  </script>
</body>
