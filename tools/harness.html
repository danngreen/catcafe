<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cat Cafe smoke test</title>
<link rel="stylesheet" href="../styles.css">
<script>
// Collect anything that goes wrong before the game module loads.
window.__errors = [];
window.addEventListener('error', (e) => {
  window.__errors.push(`ERROR: ${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`);
});
window.addEventListener('unhandledrejection', (e) => {
  window.__errors.push(`REJECT: ${e.reason && e.reason.stack ? e.reason.stack : e.reason}`);
});
const _err = console.error;
console.error = (...a) => {
  window.__errors.push('CONSOLE: ' + a.map((x) => (x && x.stack ? x.stack : String(x))).join(' '));
  _err.apply(console, a);
};
const _warn = console.warn;
console.warn = (...a) => { window.__errors.push('WARN: ' + a.join(' ')); _warn.apply(console, a); };
</script>
</head>
<body>
  <div id="frame">
    <canvas id="screen" width="480" height="270"></canvas>
  </div>

  <!-- Mirrors index.html so the touch layout can be exercised here too. -->
  <button id="fsbtn" hidden aria-label="Fullscreen">&#9974;</button>
  <div id="touch" hidden>
    <div class="dpad">
      <button data-key="ArrowUp" class="tb up">&#9650;</button>
      <button data-key="ArrowLeft" class="tb left">&#9664;</button>
      <button data-key="ArrowRight" class="tb right">&#9654;</button>
      <button data-key="ArrowDown" class="tb down">&#9660;</button>
      <button data-toggle="run" class="tb run" aria-label="Toggle run">RUN</button>
    </div>
    <div class="abtns">
      <button data-key="Escape" class="tb menu">MENU</button>
      <button data-key="x" class="tb back">BACK</button>
      <button data-key=" " class="tb act">ACT</button>
    </div>
  </div>
  <pre id="out" style="position:absolute;left:0;top:0;color:#0f0;font:12px monospace;z-index:99;background:#000;max-width:100%;white-space:pre-wrap"></pre>
  <script type="module">
    // Drive the game for a while, then report.
    const SCRIPT = (window.location.hash || '#walk').slice(1);
    const t0 = performance.now();
    try {
      await import('../src/main.js');
      window.__importMs = Math.round(performance.now() - t0);
    } catch (e) {
      window.__errors.push('IMPORT: ' + (e && e.stack ? e.stack : e));
    }

    function key(code, down) {
      window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup', { code, bubbles: true }));
    }

    async function wait(ms) { return new Promise((r) => setTimeout(r, ms)); }

    /** How much was drawn on a canvas — for "is this on screen at all". */
    function ink(ctx2, w = 480, h = 270) {
      const d = ctx2.getImageData(0, 0, w, h).data;
      let n = 0;
      for (let i = 3; i < d.length; i += 4) if (d[i] > 40) n++;
      return n;
    }

    (async () => {
      await wait(400);
      const g = window.game;
      if (!g) {
        report(['game never constructed', ...window.__errors]);
        return;
      }

      if (SCRIPT === 'walk') {
        // Walk around outdoors for a bit.
        for (const code of ['ArrowDown', 'ArrowLeft', 'ArrowUp', 'ArrowRight']) {
          key(code, true); await wait(500); key(code, false);
        }
      } else if (SCRIPT === 'cafe') {
        g.enterInterior('cafe', g.state.cafeMap, g.homeDoor.x, g.homeDoor.y);
        await wait(1200);
        g.state.shopOpen = true;
        g.state.clock.t = 11 * (1200 / 24);
        // Force a few customers through the door.
        for (let i = 0; i < 4; i++) { g.state.cafeSim.trySpawn(g.state.cafeMap); await wait(300); }
        await wait(2500);
        // Everyone still queueing should be showing what they want to order.
        const waiting = g.state.cafeSim.customers.filter((c) => c.state === 'waiting');
        window.__bubbles = `${waiting.filter((c) => c.emoteIcon).length}/${waiting.length}`;
        if (waiting.length && waiting.some((c) => !c.emoteIcon)) {
          window.__errors.push('a waiting customer had no order bubble: ' + window.__bubbles);
        }
      } else if (SCRIPT === 'summarylines') {
        // A busy night's card: it has to hold every line it shows, above the
        // Space prompt rather than over it.
        const { SummaryScreen } = await import('../src/ui/menus.js');
        const lines = [
          { text: 'Cats fed on fresh fish.', tone: 'good' },
          { text: 'Marmalade is sneezing. Take them to the vet.', tone: 'bad' },
          { text: 'Cat upkeep: 12', tone: 'cost' },
          { text: "Saffron's wage: 90", tone: 'cost' },
          { text: '4 x Croissant went off.', tone: 'warn' },
          { text: '3 asked for Matcha. You had none.', tone: 'warn' },
          { text: '2 left without buying anything.', tone: 'bad' },
        ];
        g.push(new SummaryScreen(g, {
          day: 4, customers: 14, revenue: 260, costs: 102, profit: 158, lines, slept: false,
        }));
        await wait(4200);
        const s = g.screens[g.screens.length - 1];
        window.__sum = `screen=${s && s.constructor.name} lines=${lines.length}`;
        if (!s || s.constructor.name !== 'SummaryScreen') {
          window.__errors.push('no summary card: ' + window.__sum);
        }
      } else if (SCRIPT === 'nightfolk') {
        // Dusk and dawn swap the cast over, and nobody blinks in or out: the
        // day crowd walks to a door or a treeline, the night crowd comes from
        // one. Checked by watching the walk, not just the end state.
        const st = g.state;
        const byId = (id) => g.villagers.find((v) => v.def.id === id);
        st.clock.t = 12 * (1200 / 24);
        g.updateVillagerShift();
        await wait(400);
        const dayOut = byId('nettle').shift, ghostOut = byId('woofers').shift;

        st.clock.t = 21 * (1200 / 24);      // after dark
        g.updateVillagerShift();
        await wait(300);
        const leaving = g.villagers.filter((v) => v.shift === 'leaving').length;
        const arriving = g.villagers.filter((v) => v.shift === 'arriving').length;
        // They should be *walking*, and fading rather than vanishing.
        const mid = byId('nettle');
        const midAlpha = mid.alpha;
        await wait(6000);
        const nightNow = g.villagers.filter((v) => v.def.when === 'night' && v.shift === 'here').length;
        const dayNow = g.villagers.filter((v) => v.def.when !== 'night' && v.def.when !== 'always' && v.shift === 'here').length;
        window.__night = `byDay[${dayOut}/${ghostOut}] atDusk[leaving=${leaving} arriving=${arriving}`
          + ` fading=${midAlpha < 1}] after[night=${nightNow} day=${dayNow}]`;
        if (dayOut !== 'here') window.__errors.push('day folk not out by day: ' + window.__night);
        if (ghostOut !== 'away') window.__errors.push('the ghost was out in daylight: ' + window.__night);
        if (!leaving || !arriving) window.__errors.push('nobody walked anywhere at dusk: ' + window.__night);
        if (!nightNow) window.__errors.push('night folk never arrived: ' + window.__night);
        if (dayNow) window.__errors.push('day folk still out after dark: ' + window.__night);
      } else if (SCRIPT === 'pierlook') {
        const st = g.state;
        const pier = g.landmarks.find((l) => l.id === 'pier');
        st.clock.t = 21 * (1200 / 24);
        g.player.x = pier.x * 16 + 8; g.player.y = (pier.y - 3) * 16;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        await wait(1500);
      } else if (SCRIPT === 'hedgelook') {
        const st = g.state;
        const b = g.landmarks.find((l) => l.id === 'bushes');
        st.clock.t = 21.5 * (1200 / 24);
        g.updateVillagerShift();
        g.player.x = b.x * 16 + 8; g.player.y = (b.y + 2) * 16;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        const w = g.villagers.find((v) => v.def.id === 'woofers');
        w.shift = 'here'; w.alpha = 1;
        await wait(2500);
      } else if (SCRIPT === 'journalstep') {
        // The journal has to say what to do next, or a five-step job is a
        // guessing game. Esc -> Journal, and read what it says.
        const st = g.state;
        const { QUEST_BY_ID, objectiveText } = await import('../src/game/quests.js');
        st.quests.lane_end_hedge = 'active';
        st.questStep.lane_end_hedge = 0;
        key('Escape', true); await wait(140); key('Escape', false);
        await wait(400);
        // Arrow down to Journal and open it.
        const pause = g.screens[g.screens.length - 1];
        const idx = pause ? pause.items.indexOf('Journal') : -1;
        for (let i = 0; i < idx; i++) { key('ArrowDown', true); await wait(110); key('ArrowDown', false); }
        key('Space', true); await wait(160); key('Space', false);
        await wait(500);
        const scr = g.screens[g.screens.length - 1];
        const text = objectiveText(QUEST_BY_ID.lane_end_hedge, st);
        window.__journal = `screen=${scr && scr.constructor.name} says="${text}"`;
        if (!scr || scr.constructor.name !== 'JournalScreen') {
          window.__errors.push('could not open the journal: ' + window.__journal);
        }
        if (!/hedge/i.test(text) || !/dark/i.test(text)) {
          window.__errors.push('journal does not say what to do: ' + window.__journal);
        }
        if (!/1\/5/.test(text)) window.__errors.push('journal does not show progress: ' + window.__journal);
        // A step note is a sentence, so it has to wrap: the panel is about
        // 210px wide inside its border and an unwrapped line gets clipped.
        const { textWidth } = await import('../src/engine/font.js');
        const { wrapText } = await import('../src/engine/util.js');
        const wrapped = wrapText(text, 32);
        const widest = Math.max(...wrapped.map((l) => textWidth(l)));
        window.__journal += ` lines=${wrapped.length} widest=${widest}px`;
        if (widest > 200) window.__errors.push('objective still runs off the panel: ' + window.__journal);
        await wait(600);
      } else if (SCRIPT === 'netquesthost' || SCRIPT === 'netquestguest') {
        // Two people in front of the same villager, both reading the same
        // offer. Taking it on twice used to hand out a second parcel and put
        // the step count back to zero for both of them.
        const st = g.state;
        const host = SCRIPT === 'netquesthost';
        await wait(host ? 1500 : 5000);

        // Whoever actually takes it on is the only one who gets the parcel.
        const mine = st.startQuest('lost_bell');
        if (mine) st.give('lost_bell', 1);
        await wait(2500);

        if (host) {
          st.startQuest('lane_end_hedge');
          st.setQuestStep('lane_end_hedge', 3);
        }
        await wait(3500);
        if (!host) {
          // A client a moment behind must not drag the job back to the start.
          st.startQuest('lane_end_hedge');
          st.setQuestStep('lane_end_hedge', 0);
        }
        await wait(3500);

        window.__q = `tookIt=${mine} bell=${st.quests.lost_bell}`
          + ` parcels=${st.inventory.lost_bell || 0}`
          + ` hedge=${st.quests.lane_end_hedge}@${st.questStep.lane_end_hedge || 0}`;
        if (st.quests.lost_bell !== 'active') window.__errors.push('nobody took the job: ' + window.__q);
        if ((st.inventory.lost_bell || 0) !== 1) {
          window.__errors.push('wrong number of parcels handed out: ' + window.__q);
        }
        if ((st.questStep.lane_end_hedge || 0) !== 3) {
          window.__errors.push('the job went backwards: ' + window.__q);
        }
      } else if (SCRIPT === 'debugpos') {
        // The readout has to say where you are, in the same units the world is
        // authored in — otherwise it can't help you find anything.
        const st = g.state;
        g.net.debug = true;
        const b = [...g.overworld.interacts].find(([, v]) => v.barrier === 'eastpass');
        const [bx, by] = b[0].split(',').map(Number);
        g.player.x = bx * 16 + 8; g.player.y = (by + 2) * 16 - 2;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        await wait(900);
        const p = st.hooks.playerPos();
        window.__pos = `slab=${bx},${by} standing=${Math.floor(p.x / 16)},${Math.floor(p.y / 16)} map=${p.map}`;
        if (Math.floor(p.x / 16) !== bx) window.__errors.push('position is wrong: ' + window.__pos);
        await wait(700);
      } else if (SCRIPT === 'netlivesave') {
        // Join whatever the server is actually holding and report the state of
        // the pass. Pointed at a real save, this says whether that save is
        // playable — which is the only question that matters about it.
        const st = g.state;
        const map = g.overworld;
        let w = 0;
        while (!g.net.joined && w < 8000) { await wait(250); w += 250; }
        await wait(1500);
        const stones = map.objects.filter((o) => o.id === 'eastpass');
        const flag = !!st.flags.barrier_eastpass;
        // Can you actually walk it? Flood from one bank to the other.
        const W = map.w, H = map.h;
        const reach = (from, to) => {
          const seen = new Uint8Array(W * H);
          const q = [from.y * W + from.x];
          seen[q[0]] = 1;
          for (let h = 0; h < q.length; h++) {
            const cur = q[h];
            if (cur === to.y * W + to.x) return true;
            const cx = cur % W, cy = (cur / W) | 0;
            for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
              const nx = cx + dx, ny = cy + dy;
              if (nx < 1 || ny < 1 || nx >= W - 1 || ny >= H - 1) continue;
              const ni = ny * W + nx;
              if (seen[ni] || map.solid(nx, ny)) continue;
              seen[ni] = 1; q.push(ni);
            }
          }
          return false;
        };
        const open = reach(g.towns.hollowdown.hub, g.towns.thistlewick.hub);
        window.__live = `day=${st.clock.day} money=${st.money} flag=${flag}`
          + ` stonesStanding=${stones.length} townsConnected=${open}`
          + ` quest=${st.quests.clear_the_path || 'not taken'}`;
        if (flag && stones.length) window.__errors.push('cleared pass is still blocked: ' + window.__live);
        if (!open) window.__errors.push('cannot get between the towns at all: ' + window.__live);
      } else if (SCRIPT === 'netpasscleared') {
        // The real case: joining a valley whose books already say the pass was
        // cleared. The stones must not be standing when you arrive.
        const st = g.state;
        const map = g.overworld;
        const before = map.objects.filter((o) => o.id === 'eastpass').length;
        // Whoever runs the room clears it; everybody else finds out by sync.
        st.flags.barrier_eastpass = true;
        st.touch('flags');
        let w = 0;
        while (map.objects.filter((o) => o.id === 'eastpass').length && w < 8000) {
          await wait(250); w += 250;
        }
        const after = map.objects.filter((o) => o.id === 'eastpass').length;
        window.__cleared = `via=${g.net.transport} stones ${before}->${after} in ${w}ms`;
        if (after) window.__errors.push('the pass stayed shut for the other player: ' + window.__cleared);
      } else if (SCRIPT === 'passcleared') {
        // A barrier you have already cleared has to stay cleared. The world is
        // rebuilt from the seed every time the game starts, so the stones come
        // back while the flag saying they are gone persists — which walls you
        // in behind rubble the game believes it has already removed.
        const st = g.state;
        const map = g.overworld;
        const before = map.objects.filter((o) => o.id === 'eastpass').length;
        st.flags.barrier_eastpass = true;
        // Exactly what happens on load, on joining, or when the other player
        // clears it while you are stood next to it.
        g.applyClearedBarriers();
        await wait(400);
        const after = map.objects.filter((o) => o.id === 'eastpass').length;
        const stillSolid = [];
        for (const o of map.objects) {
          if (o.id === 'eastpass') stillSolid.push(`${o.tx},${o.ty}`);
        }
        window.__cleared = `stones ${before}->${after} left=[${stillSolid.join(' ')}]`;
        if (!before) window.__errors.push('no stones to begin with: ' + window.__cleared);
        if (after) window.__errors.push('cleared stones came back: ' + window.__cleared);
      } else if (SCRIPT === 'passlook') {
        const stones = g.overworld.objects.filter((o) => o.id === 'eastpass');
        const cx = stones.reduce((a, o) => a + o.tx, 0) / stones.length;
        const cy = stones.reduce((a, o) => a + o.ty, 0) / stones.length;
        g.player.x = cx * 16 + 8; g.player.y = (cy - 2) * 16;
        g.cam.follow(g.overworld, g.player.x, g.player.y, true);
        await wait(1400);
      } else if (SCRIPT === 'weather') {
        // Two things worth proving: every machine in a valley gets the same
        // sky from the seed alone, and the sky is actually drawn. A weather
        // system that only exists in a variable is not weather.
        const { weatherOn, weatherNow } = await import('../src/game/weather.js');
        const st = g.state;
        const seed = g.worldSeed;

        // Determinism, and a spread wide enough to be worth having.
        const seen = {};
        for (let d = 0; d < 120; d++) {
          const w = weatherOn(seed, d);
          if (weatherOn(seed, d).id !== w.id) window.__errors.push('weather is not stable for a day');
          seen[w.id] = (seen[w.id] || 0) + 1;
        }
        const kinds = Object.keys(seen).sort();
        // Snow belongs to winter. Day 84-111 is the winter of the first year.
        let snowOut = 0;
        for (let d = 0; d < 84; d++) if (weatherOn(seed, d).id === 'snow') snowOut++;

        // The sky follows the day, checked against the pure function rather
        // than by moving the clock: in a shared valley the server owns the
        // clock and puts back any day we set behind its back.
        let follows = true;
        for (let d = 0; d < 40; d++) {
          const sky = weatherNow(seed, { day: d, t: 3600 });
          if (sky.now.id !== weatherOn(seed, d).id) follows = false;
        }
        // Midnight is a fade, not a jump: a second into a new day you are
        // still mostly in yesterday's weather.
        const turning = weatherNow(seed, { day: 5, t: 1 });
        const settled = weatherNow(seed, { day: 5, t: 9999 });

        // Drawn. Two valleys, same day, different sky — which is the sync
        // story as well: the seed alone decides, so nothing is sent.
        const seedWhere = (want) => {
          for (let k = 1; k < 4000; k++) if (weatherOn(k, st.clock.day).id === want) return k;
          return -1;
        };
        // A patch of ground clear of everything that animates on its own: the
        // clock panel at the top, the location banner under it, and the toasts
        // along the bottom — including the one this system raises itself.
        const shot = () => {
          const c = document.getElementById('screen');
          return c.getContext('2d').getImageData(30, 80, c.width - 60, 90).data;
        };
        const diff = (a, b) => {
          let n = 0;
          for (let i = 0; i < a.length; i += 4) {
            if (Math.abs(a[i] - b[i]) > 10 || Math.abs(a[i + 2] - b[i + 2]) > 10) n++;
          }
          return n;
        };
        // On and off, the way the employee test does it: shoot the frame with
        // the real effect, swap in one that draws nothing, shoot again. What
        // changes is exactly what the overlay puts on the screen —
        // a frame-to-frame diff would also catch the tint, and rain and cloud
        // both take light out of the sky.
        const { WeatherFx, WEATHER } = await import('../src/game/weather.js');
        const seeFrom = async (kind) => {
          g.worldSeed = seedWhere(kind);
          await wait(1100);
          const real = g.weatherFx;
          const on = shot();
          g.weatherFx = { update() {}, draw() {}, drops: [], flakes: [] };
          await wait(120);
          const off = shot();
          g.weatherFx = real;
          return { id: g.sky.now.id, drawn: diff(on, off), particles: real.drops.length };
        };

        const still = await seeFrom('cloudy');
        const wet = await seeFrom('rain');
        const drops = wet.particles;
        const wasOutdoor = g.currentMap.outdoor;

        // Snow is winter's, and the server owns the calendar, so it gets
        // driven through the effect directly rather than by waiting for
        // February. Same code, onto a canvas we can count.
        const snowSky = { now: WEATHER.snow, from: WEATHER.snow, blend: 1, today: WEATHER.snow };
        const fx = new WeatherFx(200, 120);
        for (let i = 0; i < 40; i++) fx.update(1 / 30, snowSky, false);
        const flakes = fx.flakes.length;
        const off = document.createElement('canvas');
        off.width = 200; off.height = 120;
        const og = off.getContext('2d');
        fx.draw(og, snowSky, false);
        const pix = og.getImageData(0, 0, 200, 120).data;
        let white = 0;
        for (let i = 0; i < pix.length; i += 4) if (pix[i] > 240 && pix[i + 3] > 200) white++;
        // And indoors you are out of it entirely.
        og.clearRect(0, 0, 200, 120);
        fx.draw(og, snowSky, true);
        const inPix = og.getImageData(0, 0, 200, 120).data;
        let indoorWhite = 0;
        for (let i = 0; i < inPix.length; i += 4) if (inPix[i] > 240 && inPix[i + 3] > 200) indoorWhite++;

        window.__weather = `kinds=${kinds.join('/')} snowBeforeWinter=${snowOut} follows=${follows}`
          + ` turn=${turning.from.id}->${turning.now.id}@${turning.blend.toFixed(2)}`
          + ` settled=${settled.blend}`
          + ` saw=${still.id}/${wet.id} drops=${drops} flakes=${flakes}`
          + ` snowPixels=${white} indoorPixels=${indoorWhite}`
          + ` onScreen cloudy=${still.drawn} rain=${wet.drawn} outdoor=${wasOutdoor}`;
        if (kinds.length < 5) window.__errors.push('the sky barely changes: ' + window.__weather);
        if (snowOut) window.__errors.push('it snowed outside winter: ' + window.__weather);
        if (!follows) window.__errors.push('weatherNow disagrees with weatherOn: ' + window.__weather);
        if (turning.blend > 0.1) window.__errors.push('midnight jumps instead of fading: ' + window.__weather);
        if (settled.blend !== 1) window.__errors.push('the changeover never finishes: ' + window.__weather);
        if (still.id !== 'cloudy' || wet.id !== 'rain') {
          window.__errors.push('the sky did not follow the valley: ' + window.__weather);
        }
        if (!drops) window.__errors.push('rain with no raindrops: ' + window.__weather);
        if (!flakes) window.__errors.push('snow with no snowflakes: ' + window.__weather);
        if (wet.drawn < 300) window.__errors.push('the rain is not drawn: ' + window.__weather);
        if (white < 30) window.__errors.push('the snow is not drawn: ' + window.__weather);
        if (indoorWhite) window.__errors.push('it is snowing indoors: ' + window.__weather);
      } else if (SCRIPT.startsWith('skyshot')) {
        // A look at one kind of weather, for the eye rather than the counter.
        const { weatherOn } = await import('../src/game/weather.js');
        const kind = SCRIPT.split(':')[1] || 'rain';
        const st = g.state;
        for (let k = 1; k < 4000; k++) {
          if (weatherOn(k, st.clock.day).id === kind) { g.worldSeed = k; break; }
        }
        await wait(2200);
        window.__pass = `sky=${g.sky.now.id}`;
      } else if (SCRIPT === 'weathercafe') {
        // The sky has to reach the till, not just the screen. Three claims:
        // bad weather thins the crowd, a fire wins most of it back, and what
        // people ask for follows the temperature.
        const { WEATHER } = await import('../src/game/weather.js');
        const st = g.state;
        const sim = st.cafeSim;
        // A stocked, furnished cafe, so charm is not the thing that varies.
        for (const id of ['house_coffee', 'cocoa', 'lemonade', 'iced_tea', 'cookie', 'cake']) {
          sim.addStock(id, 40, st.clock.day);
        }
        const forceSky = (kind) => {
          const w = WEATHER[kind];
          Object.defineProperty(st, 'sky', {
            configurable: true,
            get: () => ({ now: w, from: w, blend: 1, today: w }),
          });
        };

        const rateIn = (kind) => { forceSky(kind); return sim.arrivalRate(); };
        const sunny = rateIn('sunny');
        const rainy = rateIn('rain');
        const snowy = rateIn('snow');

        const { ITEMS, STOCK, FLEA_POOL } = await import('../src/game/items.js');
        const { VILLAGERS } = await import('../src/world/places.js');
        const st = g.state;
        const ids = new Set(VILLAGERS.map((v) => v.id));
        // Two villagers sharing an id is silent and nasty: every lookup finds
        // whichever was written first, so the other one can be given a quest
        // they will never be asked about. There were two such pairs.
        const seenIds = {};
        const dupeIds = [];
        for (const v of VILLAGERS) { if (seenIds[v.id]) dupeIds.push(v.id); seenIds[v.id] = 1; }

        // as a reward, or given by a step.
        const gettable = new Set();
        for (const list of Object.values(STOCK)) for (const id of list) gettable.add(id);
        for (const id of FLEA_POOL) gettable.add(id);
        for (const q of QUESTS) {
          for (const [id] of q.reward?.items || []) gettable.add(id);
          for (const step of questSteps(q)) {
            for (const [id] of step.gives || []) gettable.add(id);
            const o = step.objective;
            if (o.type === 'deliver' && o.give !== false) gettable.add(o.item);
          }
        }
        // Plus whatever the world itself hands over when you search it. Run
        // each spot under every combination of light and flags that matters,
        // so a spot that only gives its thing once you know to look still
        // counts — and one that gives nothing at all does not.
        const { SEARCH_SPOTS } = await import('../src/main.js');
        const { buildSpecialInterior, buildShopInterior } = await import('../src/world/interiors.js');
        const { SHOPS, LANDMARKS } = await import('../src/world/places.js');
        // Only spots that are actually wired into a map count. A spot that
        // exists in code but is not placed anywhere is exactly the dead end
        // this whole check is for — the logbook was one.
        const placed = new Set();
        const sweep = (map) => {
          if (!map || !map.interacts) return;
          for (const [, v] of map.interacts) if (v.kind === 'search' && v.spot) placed.add(v.spot);
        };
        sweep(g.overworld);
        for (const l of LANDMARKS) { try { sweep(buildSpecialInterior(l.id)); } catch { /* not all have one */ } }
        for (const sh of SHOPS) { try { sweep(buildShopInterior(sh.id)); } catch { /* ditto */ } }
        const orphaned = Object.keys(SEARCH_SPOTS).filter((k) => !placed.has(k));
        const spots = [...placed];
        const givesFrom = {};
        for (const name of spots) {
          // A player who is actually on the job: some spots only give a
          // one-off item up while the quest that wants it is running, which is
          // correct and would otherwise read as unobtainable.
          const active = {};
          for (const qq of QUESTS) active[qq.id] = 'active';
          const probe = {
            clock: { isDark: true },
            flags: { read_town_history: true, saw_the_hedge: true },
            quests: active,
            has: () => false,
            inventory: {},
          };
          const dayProbe = { ...probe, clock: { isDark: false } };
          for (const p of [probe, dayProbe]) {
            const res = SEARCH_SPOTS[name](p, g) || {};
            if (res.give) { gettable.add(res.give[0]); (givesFrom[res.give[0]] ||= []).push(name); }

              unknownPerson.push(`${q.id}->${o.to}`);

        const pointsAtMoth = /moth/i.test(`${shrimp.hint || ''} ${shrimp.lines.join(' ')}`);

        st.clock.t = 22 * (1200 / 24);

        const { REGULARS, visitOn, dueNow } = await import('../src/game/regulars.js');

        const fenDark = st.clock.isDark;

        await wait(900);

        st.clock.day = (() => { for (let d = 0; d < 200; d++) if (visitOn(def, seed, d)) return d; return 0; })();
        const win = visitOn(def, seed, st.clock.day);
        st.clock.t = (win.from + 0.5) * (1200 / 24);
        // Stand well away from the door so he has to cross the room.

        g.player.y = (meta.offY + 6) * 16;
        g.cam.follow(st.cafeMap, g.player.x, g.player.y, true);
        await wait(1200);
        const inRoom = (st.cafeMap.villagers || []).filter((v) => v.def.id === 'linnet');
        const v0 = inRoom[0];
        const startD = v0 ? Math.hypot(v0.x - g.player.x, v0.y - g.player.y) : -1;
        await wait(2500);
        const endD = v0 ? Math.hypot(v0.x - g.player.x, v0.y - g.player.y) : -1;

        // He does not queue: a regular must never be one of the customers.

          + ` inRoom=${inRoom.length} settled ${startD.toFixed(0)}->${endD.toFixed(0)}`
          + ` asCustomer=${asCustomer} marked=${marked} normalSize=${normalSize} spoke=${spoke}`
          + ` regulars=${REGULARS.length} idle=[${idle}] wrongHour=${wrongHour.length}`
          + ` fennel in=${fenIn} inDaylight=${!fenDark} leaves=${fenGone}`;
        if (outside) window.__errors.push('a regular is standing about in the valley: ' + window.__reg);
        if (!days) window.__errors.push('the regular never comes at all: ' + window.__reg);
        if (rate > 0.6) window.__errors.push('the regular is not rare enough: ' + window.__reg);
        if (tooEarly) window.__errors.push('a night regular turned up in daylight: ' + window.__reg);
        if (!stable) window.__errors.push('two players would see different visits: ' + window.__reg);
        if (!differs) window.__errors.push('every valley gets the same visits: ' + window.__reg);
        if (notDue) window.__errors.push('the quiet day was not quiet: ' + window.__reg);
        if (!dueBecauseWaiting) window.__errors.push('waiting on him does not bring him in: ' + window.__reg);
        if (!inRoom.length) window.__errors.push('she never came in: ' + window.__reg);

      } else if (SCRIPT === 'regularshot') {

      } else if (SCRIPT === 'delivery') {

        if (!talkable) window.__errors.push('you cannot talk to the phone: ' + window.__deliv);

      } else if (SCRIPT === 'cottages') {

        if (unreachable) window.__errors.push('part of a cottage floor cannot be reached: ' + window.__cots);
      } else if (SCRIPT === 'content') {

        + (window.__bubbles !== undefined ? ` orderBubbles=${window.__bubbles}` : '');
      if (window.__terrain) { out.textContent = window.__terrain; document.title = 'OK'; window.__done = true; return; }
      const info = g ? `mode=${g.mode} map=${g.state.mapId} objs=${g.currentMap ? g.currentMap.objects.length : '?'} villagers=${g.villagers ? g.villagers.length : '?'} money=${g.state.money} cats=${g.state.cats.length} seats=${g.state.cafeSim.seats().length}${extra}` : 'no game';
      out.textContent = `RESULT ${errs.length ? 'FAIL' : 'OK'} (${errs.length} issues)\n${info}\n` + errs.slice(0, 25).join('\n');
      document.title = errs.length ? `FAIL ${errs.length}` : 'OK';
      if (window.location.search.includes('hideout')) out.style.display = 'none';
      // The runner watches for this rather than sleeping out the clock. Most
      // scenarios finish well inside their budget, and waiting for the budget
      // anyway was most of the time the suite took.
      window.__done = true;
    }
  </script>
</body>
</html>
